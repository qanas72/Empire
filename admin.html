<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Empire — Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#f5f5f5;
  line-height:1.5;
}

button,
input,
textarea{
  font:inherit;
}

.container{
  width:min(1150px,92%);
  margin:auto;
}

/* HEADER */

header{
  border-bottom:1px solid #ffffff12;
  background:#0a0a0a;
}

.nav{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-decoration:none;
  font-weight:900;
  font-size:22px;
}

.crown{
  width:39px;
  height:39px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#f6c453,#9a6414);
  color:#111;
  font-size:21px;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.user{
  color:#999;
  font-size:13px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 17px;
  cursor:pointer;
  font-weight:800;
}

.btn-gold{
  background:linear-gradient(135deg,#f1c75a,#a86e16);
  color:#111;
}

.btn-dark{
  background:#ffffff08;
  border:1px solid #ffffff18;
  color:#ddd;
}

.btn-danger{
  background:#501919;
  border:1px solid #7b2929;
  color:#ffb5b5;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* MAIN */

main{
  padding:45px 0 80px;
}

.page-title{
  margin-bottom:30px;
}

.eyebrow{
  color:#dcb044;
  font-size:12px;
  letter-spacing:2px;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:8px;
}

h1{
  font-size:38px;
}

.page-title p{
  color:#888;
  margin-top:8px;
}

/* PANELS */

.panel{
  background:#101010;
  border:1px solid #ffffff12;
  border-radius:16px;
  padding:25px;
  margin-bottom:25px;
}

.panel h2{
  font-size:21px;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#aaa;
  font-size:13px;
  font-weight:700;
}

input,
textarea{
  width:100%;
  background:#080808;
  border:1px solid #ffffff18;
  color:#fff;
  border-radius:9px;
  padding:13px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#c99a38;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input[type=file]{
  padding:10px;
}

.file-info{
  color:#777;
  font-size:12px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

/* PROGRESS */

.progress-wrap{
  display:none;
  margin-top:20px;
}

.progress-wrap.show{
  display:block;
}

.progress{
  width:100%;
  height:8px;
  background:#242424;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#e4bb4c,#9b6819);
  transition:.2s;
}

.progress-text{
  margin-top:7px;
  color:#888;
  font-size:12px;
}

/* STATUS */

.status{
  padding:14px;
  border-radius:9px;
  margin-top:15px;
  display:none;
  font-size:13px;
}

.status.show{
  display:block;
}

.status.success{
  background:#102418;
  border:1px solid #214f2d;
  color:#a8e5b4;
}

.status.error{
  background:#281212;
  border:1px solid #5a2424;
  color:#ffaaaa;
}

/* VIDEOS */

.video-list{
  display:grid;
  gap:12px;
}

.video-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:16px;
  border:1px solid #ffffff10;
  border-radius:12px;
  background:#0b0b0b;
}

.video-info{
  min-width:0;
}

.video-title{
  font-weight:800;
  margin-bottom:4px;
}

.video-description{
  color:#777;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.video-path{
  color:#555;
  font-size:11px;
  margin-top:5px;
  word-break:break-all;
}

.video-actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.empty{
  text-align:center;
  padding:35px;
  color:#777;
  border:1px dashed #ffffff15;
  border-radius:12px;
}

/* FOOTER */

footer{
  border-top:1px solid #ffffff10;
  padding:30px 0;
  color:#666;
  font-size:12px;
}

@media(max-width:700px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .video-row{
    flex-direction:column;
    align-items:flex-start;
  }

  .video-actions{
    width:100%;
  }

  .video-actions button{
    flex:1;
  }

  .user{
    display:none;
  }

  h1{
    font-size:31px;
  }
}
</style>
</head>

<body>

<header>

  <div class="container nav">

    <a href="index.html" class="brand">
      <span class="crown">♛</span>
      EMPIRE
    </a>

    <div class="nav-right">

      <span class="user" id="adminName">
        Checking...
      </span>

      <button
        class="btn btn-dark"
        onclick="goHome()">
        Website
      </button>

      <button
        class="btn btn-danger"
        onclick="logout()">
        Logout
      </button>

    </div>

  </div>

</header>


<main>

<div class="container">

  <div class="page-title">

    <div class="eyebrow">
      Empire Control Center
    </div>

    <h1>Admin Panel</h1>

    <p>
      Upload and manage your private video library.
    </p>

  </div>


  <!-- UPLOAD -->

  <section class="panel">

    <h2>Upload New Video</h2>

    <div class="form-grid">

      <div class="field">

        <label for="title">
          Video Title
        </label>

        <input
          id="title"
          type="text"
          placeholder="Enter video title">

      </div>


      <div class="field">

        <label for="thumbnail">
          Thumbnail URL
        </label>

        <input
          id="thumbnail"
          type="url"
          placeholder="Optional image URL">

      </div>


      <div class="field full">

        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          placeholder="Write a description for this video"></textarea>

      </div>


      <div class="field full">

        <label for="videoFile">
          Video File
        </label>

        <input
          id="videoFile"
          type="file"
          accept="video/*">

        <div
          class="file-info"
          id="fileInfo">
          Select a video file.
        </div>

      </div>

    </div>


    <div class="actions">

      <button
        class="btn btn-gold"
        id="uploadBtn"
        onclick="uploadVideo()">
        Upload Video
      </button>

      <button
        class="btn btn-dark"
        onclick="clearForm()">
        Clear
      </button>

    </div>


    <div
      class="progress-wrap"
      id="progressWrap">

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar">
        </div>

      </div>

      <div
        class="progress-text"
        id="progressText">
        Uploading...
      </div>

    </div>


    <div
      class="status"
      id="status">
    </div>

  </section>


  <!-- VIDEO LIST -->

  <section class="panel">

    <div style="
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:18px;
    ">

      <h2 style="margin:0">
        Video Library
      </h2>

      <button
        class="btn btn-dark"
        onclick="loadVideos()">
        Refresh
      </button>

    </div>


    <div
      class="video-list"
      id="videoList">

      <div class="empty">
        Loading videos...
      </div>

    </div>

  </section>

</div>

</main>


<footer>

  <div class="container">
    Empire Admin Panel © 2026
  </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://vubjkwbkuwndkjqfnyom.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;
let videos = [];


/* =========================================================
   AUTH + ADMIN CHECK
   ========================================================= */

async function checkAdmin(){

  try{

    const {
      data: {
        session
      },
      error
    } = await supabaseClient.auth.getSession();


    if(error){
      throw error;
    }


    if(!session){

      window.location.href =
        "login.html";

      return false;
    }


    currentUser =
      session.user;


    const {
      data: profiles,
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .select(
        "id, username, display_name, is_active"
      )
      .eq(
        "id",
        currentUser.id
      )
      .limit(1);


    if(profileError){
      throw profileError;
    }


    if(
      !profiles ||
      profiles.length === 0
    ){

      await supabaseClient.auth.signOut();

      alert(
        "Profile not found."
      );

      window.location.href =
        "login.html";

      return false;
    }


    const profile =
      profiles[0];


    if(!profile.is_active){

      await supabaseClient.auth.signOut();

      alert(
        "Your account is inactive."
      );

      window.location.href =
        "login.html";

      return false;
    }


    /*
      Admin is currently identified by
      username = qanas.

      This matches the policies already
      created in Supabase.
    */

    if(
      profile.username !== "qanas"
    ){

      alert(
        "Admin access denied."
      );

      window.location.href =
        "index.html";

      return false;
    }


    document.getElementById(
      "adminName"
    ).textContent =
      profile.display_name ||
      profile.username;


    return true;


  }catch(error){

    console.error(
      "ADMIN AUTH ERROR:",
      error
    );


    alert(
      "Could not verify admin access."
    );


    window.location.href =
      "login.html";


    return false;
  }

}


/* =========================================================
   FILE INFO
   ========================================================= */

document
  .getElementById("videoFile")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      const info =
        document.getElementById(
          "fileInfo"
        );


      if(!file){

        info.textContent =
          "Select a video file.";

        return;
      }


      const sizeMB =
        (
          file.size /
          1024 /
          1024
        ).toFixed(2);


      info.textContent =
        `${file.name} • ${sizeMB} MB • ${file.type || "video"}`;

    }
  );


/* =========================================================
   UPLOAD
   ========================================================= */

async function uploadVideo(){

  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const thumbnail =
    document
      .getElementById("thumbnail")
      .value
      .trim();


  const file =
    document
      .getElementById("videoFile")
      .files[0];


  if(!title){

    showStatus(
      "Please enter a video title.",
      "error"
    );

    return;
  }


  if(!file){

    showStatus(
      "Please select a video file.",
      "error"
    );

    return;
  }


  const uploadBtn =
    document.getElementById(
      "uploadBtn"
    );


  uploadBtn.disabled = true;

  uploadBtn.textContent =
    "Uploading...";


  showProgress(
    true,
    5,
    "Preparing upload..."
  );


  try{

    /*
      Create a unique path.

      Example:

      videos/
        8166.../
          1726200000-my-video.mp4
    */

    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const filePath =
      currentUser.id +
      "/" +
      Date.now() +
      "-" +
      safeName;


    showProgress(
      true,
      20,
      "Uploading video to secure storage..."
    );


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("videos")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:
              file.type ||
              "video/mp4"
          }
        );


    if(uploadError){
      throw uploadError;
    }


    showProgress(
      true,
      80,
      "Saving video information..."
    );


    const {
      error: insertError
    } =
      await supabaseClient
        .from("videos")
        .insert({

          title:title,

          description:
            description ||
            null,

          thumbnail_url:
            thumbnail ||
            null,

          video_path:
            filePath

        });


    if(insertError){

      /*
        If database insert fails after
        successful upload, attempt to
        remove the uploaded file.
      */

      await supabaseClient
        .storage
        .from("videos")
        .remove([
          filePath
        ]);


      throw insertError;
    }


    showProgress(
      true,
      100,
      "Upload complete!"
    );


    showStatus(
      "Video uploaded successfully.",
      "success"
    );


    clearForm();


    await loadVideos();


    setTimeout(
      function(){

        showProgress(
          false
        );

      },
      1200
    );


  }catch(error){

    console.error(
      "UPLOAD ERROR:",
      error
    );


    showProgress(
      false
    );


    showStatus(
      "Upload failed: " +
      (error.message ||
       "Unknown error"),
      "error"
    );


  }finally{

    uploadBtn.disabled =
      false;

    uploadBtn.textContent =
      "Upload Video";

  }

}


/* =========================================================
   LOAD VIDEOS
   ========================================================= */

async function loadVideos(){

  const list =
    document.getElementById(
      "videoList"
    );


  list.innerHTML =
    `<div class="empty">Loading...</div>`;


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("videos")
        .select(
          "id,title,description,thumbnail_url,video_path,created_at"
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){
      throw error;
    }


    videos =
      data || [];


    if(videos.length === 0){

      list.innerHTML =
        `<div class="empty">
          No videos uploaded yet.
        </div>`;

      return;
    }


    list.innerHTML =
      videos
        .map(
          video => `

          <div class="video-row">

            <div class="video-info">

              <div class="video-title">
                ${escapeHtml(video.title)}
              </div>

              <div class="video-description">
                ${
                  escapeHtml(
                    video.description ||
                    "No description"
                  )
                }
              </div>

              <div class="video-path">
                ${escapeHtml(video.video_path)}
              </div>

            </div>


            <div class="video-actions">

              <button
                class="btn btn-dark"
                onclick="previewVideo('${video.id}')">
                Preview
              </button>

              <button
                class="btn btn-danger"
                onclick="deleteVideo('${video.id}')">
                Delete
              </button>

            </div>

          </div>

        `
        )
        .join("");


  }catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    list.innerHTML =
      `<div class="empty">
        Could not load videos:
        ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================================================
   PREVIEW
   ========================================================= */

async function previewVideo(id){

  const video =
    videos.find(
      item => item.id === id
    );


  if(!video){
    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from("videos")
        .createSignedUrl(
          video.video_path,
          3600
        );


    if(error){
      throw error;
    }


    window.open(
      data.signedUrl,
      "_blank"
    );


  }catch(error){

    alert(
      "Could not create preview URL: " +
      error.message
    );

  }

}


/* =========================================================
   DELETE VIDEO
   ========================================================= */

async function deleteVideo(id){

  const video =
    videos.find(
      item => item.id === id
    );


  if(!video){
    return;
  }


  const confirmed =
    confirm(
      `Delete "${video.title}"?\n\nThis will remove the video from the library and storage.`
    );


  if(!confirmed){
    return;
  }


  try{

    /*
      Delete physical video file
      first.
    */

    const {
      error: storageError
    } =
      await supabaseClient
        .storage
        .from("videos")
        .remove([
          video.video_path
        ]);


    if(storageError){
      throw storageError;
    }


    /*
      Delete database record.
    */

    const {
      error: dbError
    } =
      await supabaseClient
        .from("videos")
        .delete()
        .eq(
          "id",
          id
        );


    if(dbError){
      throw dbError;
    }


    showStatus(
      "Video deleted successfully.",
      "success"
    );


    await loadVideos();


  }catch(error){

    console.error(
      "DELETE ERROR:",
      error
    );


    showStatus(
      "Delete failed: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   CLEAR FORM
   ========================================================= */

function clearForm(){

  document.getElementById(
    "title"
  ).value = "";


  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "thumbnail"
  ).value = "";


  document.getElementById(
    "videoFile"
  ).value = "";


  document.getElementById(
    "fileInfo"
  ).textContent =
    "Select a video file.";

}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
  message,
  type
){

  const element =
    document.getElementById(
      "status"
    );


  element.textContent =
    message;


  element.className =
    "status show " +
    type;

}


/* =========================================================
   PROGRESS
   ========================================================= */

function showProgress(
  show,
  percent = 0,
  text = ""
){

  const wrap =
    document.getElementById(
      "progressWrap"
    );


  const bar =
    document.getElementById(
      "progressBar"
    );


  const label =
    document.getElementById(
      "progressText"
    );


  if(!show){

    wrap.classList.remove(
      "show"
    );

    return;
  }


  wrap.classList.add(
    "show"
  );


  bar.style.width =
    percent + "%";


  label.textContent =
    text;

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function goHome(){

  window.location.href =
    "index.html";

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  const confirmed =
    confirm(
      "Do you want to log out?"
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    alert(
      "Logout failed: " +
      error.message
    );

    return;
  }


  window.location.href =
    "login.html";

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   START
   ========================================================= */

(async function(){

  const allowed =
    await checkAdmin();


  if(!allowed){
    return;
  }


  await loadVideos();

})();

</script>

</body>
</html>
