<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPIRE | Members</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#e8c36b;--line:#3b321f;--muted:#aaa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#000b,#000e),url("profile-background-desktop.png") center/cover no-repeat}a{color:inherit;text-decoration:none}.top{padding:16px 5%;display:flex;justify-content:space-between;align-items:center;background:#090909ed;border-bottom:1px solid var(--line)}.back-nav{background:transparent;border:0;color:#e8c36b;padding:4px 7px;cursor:pointer;font:inherit}.brand{font-size:22px;font-weight:900;letter-spacing:2px;color:var(--gold)}.nav{display:flex;gap:18px;color:#bbb;font-size:14px}main{width:min(1000px,92%);margin:34px auto 60px}h1{margin:0 0 8px;font-size:32px}.muted{color:var(--muted);line-height:1.7}.search{width:100%;margin:20px 0;padding:14px 16px;background:#111;color:#fff;border:1px solid #514125;border-radius:11px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.member{display:flex;align-items:center;gap:13px;padding:17px;background:linear-gradient(145deg,#1b1b1b,#101010);border:1px solid var(--line);border-radius:15px;min-width:0}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#292929;border:2px solid var(--gold);flex:0 0 58px}.member-name{font-weight:800;overflow-wrap:anywhere}.handle{font-size:12px;color:#aaa;margin-top:4px}.badge{display:inline-block;margin-top:7px;font-size:10px;color:var(--gold);border:1px solid #80642f;border-radius:20px;padding:4px 8px}.badge.regular{color:#bbb;border-color:#555}.presence{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:11px;color:#aaa}.dot{width:8px;height:8px;border-radius:50%;background:#777;display:inline-block}.dot.online{background:#35d486;box-shadow:0 0 8px #35d48688}.empty{padding:24px;text-align:center;border:1px dashed #444;border-radius:12px;color:#aaa;grid-column:1/-1}
@media(max-width:600px){body:before{background:linear-gradient(#000b,#000e),url("profile-background-mobile.png") center/cover no-repeat}.top{padding:13px 4%;flex-wrap:wrap;gap:10px}.brand{font-size:19px}.nav{width:100%;justify-content:space-between;padding-top:9px;border-top:1px solid #302817;font-size:13px}h1{font-size:27px}}

/* Shared Empire crown and wordmark — match the public homepage */
.brand-mark{
 display:inline-block;font-size:30px;margin-right:8px;
 filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 9px rgba(255,40,160,.8)) drop-shadow(0 0 14px rgba(80,180,255,.65));
 transform:perspective(300px) rotateY(-12deg);
 animation:crownGlow 3s ease-in-out infinite alternate;
}
.brand-name{
 color:#ffe39a;font-weight:900;letter-spacing:1px;
 text-shadow:0 0 5px rgba(255,215,0,.8),0 0 12px rgba(255,70,170,.35);
}
@keyframes crownGlow{
 from{filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 7px rgba(255,40,160,.5));transform:perspective(300px) rotateY(-12deg) translateY(0)}
 to{filter:drop-shadow(0 0 8px #ffd700) drop-shadow(0 0 13px rgba(255,40,160,.9)) drop-shadow(0 0 17px rgba(80,180,255,.7));transform:perspective(300px) rotateY(12deg) translateY(-2px)}
}
@media(max-width:600px){.brand-mark{font-size:27px}.brand-name{letter-spacing:.7px}}

/* EMPIRE avatar image preview */
.empire-avatar-zoom{cursor:zoom-in!important}
.empire-avatar-lightbox{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.88);backdrop-filter:blur(5px)}
.empire-avatar-lightbox.is-open{display:flex}
.empire-avatar-lightbox img{display:block;max-width:min(88vw,620px);max-height:82vh;width:auto;height:auto;object-fit:contain;border-radius:16px;border:2px solid #d6ad55;box-shadow:0 18px 70px #000;animation:empireAvatarPop .18s ease-out}
.empire-avatar-lightbox button{position:absolute;top:18px;right:18px;width:42px;height:42px;border:1px solid #d6ad55;border-radius:50%;background:#17130c;color:#f5d98d;font-size:28px;line-height:1;cursor:pointer}
@keyframes empireAvatarPop{from{transform:scale(.88);opacity:.4}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.empire-avatar-lightbox img{animation:none}}

/* EMPIRE unified transparent cards — gold outline only */
:is(.card,.panel,.box,.vip-card,.feature-box,.feature-card,.stat-card,.profile-about,.date-box,.list-item,.video-row,.video-info,.access-box,.form-section,.status-box,.video-item,.post){
  background:transparent!important;
  background-image:none!important;
  border:1px solid rgba(245,217,139,.82)!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}

</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html" aria-label="Empire Home"><span class="brand-mark" aria-hidden="true">👑</span><span class="brand-name">𝑬𝒎𝒑𝒊𝒓𝒆</span></a><nav class="nav"><button type="button" onclick="history.length>1?history.back():location.href='index.html'" class="back-nav">← Back</button><a href="index.html">Home</a><a href="publishing.html">Publishing</a><a href="messages.html">Messages</a><a href="profile.html">My Profile</a></nav></header>
<main><h1>Empire <span style="color:var(--gold)">Members</span></h1><p class="muted">Discover public member profiles and their published content.</p><input id="search" class="search" type="search" placeholder="Search by name or username..."><div id="members" class="grid"><div class="empty">Loading members...</div></div></main>
<script>
const SUPABASE_URL="https://vubjkwbkuwndkjqfnyom.supabase.co",SUPABASE_KEY="sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[],presence={},currentUserId=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const fallbackAvatar="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%23222222'/%3E%3Ctext x='60' y='76' text-anchor='middle' font-size='58' fill='%23e8c36b'%3E%E2%98%BB%3C/text%3E%3C/svg%3E";
function avatar(url){return url?esc(url):fallbackAvatar;}
function render(){const q=document.getElementById("search").value.trim().toLowerCase();const filtered=rows.filter(u=>((u.display_name||"")+" "+(u.username||"")).toLowerCase().includes(q));const box=document.getElementById("members");if(!filtered.length){box.innerHTML='<div class="empty">No matching public members.</div>';return;}box.innerHTML=filtered.map(u=>'<a class="member" href="'+(currentUserId===u.id?"profile.html":"user-profile.html?username="+encodeURIComponent(u.username))+'"><img class="avatar" src="'+avatar(u.avatar_url?db.storage.from("avatars").getPublicUrl(u.avatar_url).data?.publicUrl:null)+'" alt=""><div style="min-width:0"><div class="member-name">'+esc(u.display_name)+'</div><div class="handle">@'+esc(u.username)+'</div><span class="badge '+(u.membership_type==="VIP"?"":"regular")+'">'+(u.membership_type==="VIP"?"♛ VIP":"Regular")+'</span><div class="presence"><i class="dot '+(presence[u.id]?"online":"")+'"></i>'+(presence[u.id]?"Online":"Offline")+'</div></div></a>').join("");}
document.getElementById("search").addEventListener("input",render);
(async()=>{const {data:auth}=await db.auth.getUser();currentUserId=auth?.user?.id||null;const {data,error}=await db.from("public_user_profiles").select("id,username,display_name,avatar_url,created_at,membership_type").order("created_at",{ascending:false}).limit(200);if(error){document.getElementById("members").innerHTML='<div class="empty">Could not load members. Run public-profiles-setup.sql in Supabase.</div>';console.error(error);return;}rows=data||[];await refreshPresence();render();setInterval(async()=>{await refreshPresence();render();},60000);})();
async function refreshPresence(){const ids=rows.map(u=>u.id);if(!ids.length)return;const {data,error}=await db.from("user_presence").select("user_id,last_seen").in("user_id",ids);if(error){console.warn("Presence unavailable",error);return;}const cutoff=Date.now()-120000;presence={};(data||[]).forEach(p=>{presence[p.user_id]=new Date(p.last_seen).getTime()>cutoff;});}

/* Click any profile avatar to view it larger; tap outside or close to dismiss. */
(function installEmpireAvatarPreview(){
  if(document.getElementById("empireAvatarLightbox"))return;
  const box=document.createElement("div");box.id="empireAvatarLightbox";box.className="empire-avatar-lightbox";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label","Profile photo preview");
  box.innerHTML='<button type="button" aria-label="Close photo preview">&times;</button><img alt="Profile photo enlarged">';
  document.body.appendChild(box);
  const preview=box.querySelector("img");
  function close(){box.classList.remove("is-open");preview.removeAttribute("src");}
  box.addEventListener("click",e=>{if(e.target===box||e.target.tagName==="BUTTON")close();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&box.classList.contains("is-open"))close();});
  document.addEventListener("click",e=>{
    const img=e.target.closest('img.avatar,img.avatar-large,img.avatar-small,img.community-author-avatar,img.post-author-avatar,.community-author img,.post-author img,.chat-head img.avatar');
    if(!img||!img.src||img.src.startsWith("data:"))return;
    e.preventDefault();e.stopPropagation();
    preview.src=img.currentSrc||img.src;box.classList.add("is-open");
  },true);
  document.querySelectorAll('img.avatar,img.avatar-large,img.avatar-small,.community-author img,.post-author img,.chat-head img.avatar').forEach(img=>img.classList.add("empire-avatar-zoom"));
})();
</script></body></html>
