<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Empire — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #1a1408 0%, #080808 45%, #050505 100%);
      color: #f7f7f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .box {
      width: min(420px, 92%);
      background: rgba(17, 17, 17, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 34px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.6);
    }

    .brand {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .crown {
      color: #e8b94f;
      margin-right: 5px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin: 0 0 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 700;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0b0b0b;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #c99a35;
      box-shadow: 0 0 0 2px rgba(201, 154, 53, 0.12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #f1c75a, #a86e16);
      color: #111;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      color: #ff9b9b;
      font-size: 14px;
      min-height: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="brand">
      <span class="crown">♛</span> EMPIRE
    </div>

    <p class="subtitle">
      Sign in to access your videos
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        required
        autocomplete="email"
        placeholder="Enter your email"
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
        placeholder="Enter your password"
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

    </form>

    <div id="message"></div>

    <div class="footer">
      Private Empire Video Platform
    </div>

  </div>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // ==============================
    // SUPABASE CONFIG
    // ==============================

    const SUPABASE_URL =
      "https://vubjkwbkuwndkjqfnyom.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // ELEMENTS
    // ==============================

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    // ==============================
    // LOGIN
    // ==============================

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";


      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      try {

        // Login with Supabase Auth
        const { data, error } =
          await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        if (!data.user) {
          throw new Error("Login failed.");
        }


        // ==============================
        // CHECK USER PROFILE
        // ==============================

        const { data: profile, error: profileError } =
          await supabase
            .from("profiles")
            .select("id, username, display_name, is_active")
            .eq("id", data.user.id)
            .single();


        if (profileError || !profile) {

          await supabase.auth.signOut();

          throw new Error(
            "Your account profile was not found."
          );
        }


        // Check if account is active
        if (profile.is_active !== true) {

          await supabase.auth.signOut();

          throw new Error(
            "Your account is currently disabled."
          );
        }


        // ==============================
        // SUCCESS
        // ==============================

        message.style.color = "#9cffb0";
        message.textContent = "Login successful!";

        setTimeout(function() {

          window.location.href = "index.html";

        }, 500);


      } catch (error) {

        console.error(error);

        message.style.color = "#ff9b9b";

        message.textContent =
          error.message ||
          "Login failed. Please check your email and password.";

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }

    });

  </script>

</body>
</html>
