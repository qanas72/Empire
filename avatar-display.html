<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
#avatar{display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#17130e;cursor:zoom-in}
#fallback{display:none;width:100%;height:100%;align-items:center;justify-content:center;color:#d6ad55;background:#17130e;font:12px Arial,sans-serif;text-align:center;padding:12px}
#lightbox{display:none;position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:12px}
#lightbox.open{display:flex}
#large{max-width:96%;max-height:94%;object-fit:contain;border:1px solid #d6ad55;border-radius:8px}
</style>
</head>
<body>
<img id="avatar" alt="Profile photo">
<div id="fallback">Profile photo unavailable</div>
<div id="lightbox"><img id="large" alt="Profile photo enlarged"></div>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const src=params.get("src");
 const image=document.getElementById("avatar");
 const fallback=document.getElementById("fallback");
 if(!src){image.style.display="none";fallback.style.display="flex";return;}
 image.onload=function(){fallback.style.display="none";image.style.display="block";};
 image.onerror=function(){image.style.display="none";fallback.style.display="flex";};
 image.src=src;
 const box=document.getElementById("lightbox");
 const large=document.getElementById("large");
 image.addEventListener("click",function(){if(!image.naturalWidth)return;large.src=image.currentSrc||image.src;box.classList.add("open");});
 box.addEventListener("click",function(){box.classList.remove("open");large.removeAttribute("src");});
 document.addEventListener("keydown",function(e){if(e.key==="Escape"){box.classList.remove("open");large.removeAttribute("src");}});
})();
</script>
</body>
</html>
