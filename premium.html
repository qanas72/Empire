<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Empire — Premium Videos</title>

  <meta
    name="description"
    content="Explore premium videos on Empire. Exclusive content with secure USDT access.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#080808;
      color:#fff;
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
    }

    .container{
      width:min(1180px,92%);
      margin:auto;
    }

    /* HEADER */

    header{
      position:sticky;
      top:0;
      z-index:100;
      background:#080808ee;
      backdrop-filter:blur(14px);
      border-bottom:1px solid #ffffff12;
    }

    .nav{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:24px;
      font-weight:900;
      letter-spacing:2px;
    }

    .crown{
      color:#d6a535;
      font-size:25px;
    }

    .links{
      display:flex;
      align-items:center;
      gap:22px;
    }

    .links a{
      color:#aaa;
      font-size:14px;
      transition:.2s;
    }

    .links a:hover,
    .links a.active{
      color:#fff;
    }

    .user-area{
      display:flex;
      align-items:center;
      gap:15px;
      margin-left:10px;
      padding-left:15px;
      border-left:1px solid #ffffff15;
    }

    .user-name{
      color:#d6a535;
      font-size:13px;
      font-weight:700;
    }

    .logout-btn{
      border:1px solid #ffffff18;
      background:#111;
      color:#ddd;
      padding:8px 12px;
      border-radius:9px;
      cursor:pointer;
    }

    .logout-btn:hover{
      background:#1a1a1a;
    }

    /* MOBILE MENU */

    .menu-btn{
      display:none;
      background:none;
      border:0;
      color:#fff;
      font-size:26px;
      cursor:pointer;
    }

    /* PAGE */

    main{
      padding:55px 0 80px;
    }

    .page-head{
      text-align:center;
      max-width:720px;
      margin:0 auto 45px;
    }

    .eyebrow{
      color:#d6a535;
      font-size:12px;
      font-weight:800;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .page-head h1{
      font-size:clamp(34px,5vw,58px);
      line-height:1.05;
      margin-bottom:15px;
    }

    .gold{
      color:#d6a535;
    }

    .page-head p{
      color:#888;
      line-height:1.7;
      font-size:15px;
    }

    /* GRID */

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:22px;
    }

    /* CARD */

    .card{
      background:#101010;
      border:1px solid #ffffff12;
      border-radius:17px;
      overflow:hidden;
      transition:.25s;
    }

    .card:hover{
      transform:translateY(-4px);
      border-color:#d6a53555;
    }

    .thumb{
      height:215px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(
          circle at 70% 30%,
          #d6a53555,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #262626,
          #0e0e0e
        );
      overflow:hidden;
    }

    .thumb.two{
      background:
        radial-gradient(
          circle at 25% 30%,
          #8e6a2d55,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #191919,
          #080808
        );
    }

    .thumb.three{
      background:
        radial-gradient(
          circle at 65% 65%,
          #c89c3b4d,
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #242424,
          #0b0b0b
        );
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      position:absolute;
      inset:0;
    }

    .thumb-overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          to top,
          #000d,
          transparent 65%
        );
      z-index:1;
    }

    .lock-icon{
      width:62px;
      height:62px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#111e;
      border:1px solid #ffffff25;
      color:#f1c75a;
      font-size:25px;
      position:relative;
      z-index:2;
    }

    .price-badge{
      position:absolute;
      right:12px;
      top:12px;
      background:#0a0a0add;
      border:1px solid #ffffff18;
      border-radius:999px;
      padding:6px 11px;
      font-size:12px;
      font-weight:800;
      z-index:3;
      color:#f1c75a;
    }

    .card-body{
      padding:19px;
    }

    .card-body h3{
      font-size:18px;
      margin-bottom:8px;
    }

    .card-body p{
      color:#858585;
      font-size:13px;
      line-height:1.6;
      min-height:42px;
    }

    .card-foot{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:18px;
      gap:10px;
    }

    .tag{
      color:#d6a535;
      font-size:12px;
      font-weight:800;
      border:1px solid #d6a53544;
      padding:6px 9px;
      border-radius:999px;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:10px 16px;
      cursor:pointer;
      font-weight:800;
      transition:.2s;
    }

    .btn-gold{
      background:#d6a535;
      color:#090909;
    }

    .btn-gold:hover{
      filter:brightness(1.1);
      transform:translateY(-1px);
    }

    /* STATUS */

    .status{
      grid-column:1/-1;
      text-align:center;
      padding:50px 20px;
      border:1px solid #ffffff12;
      border-radius:16px;
      background:#101010;
      color:#777;
      line-height:1.8;
    }

    .status strong{
      display:block;
      color:#fff;
      font-size:18px;
      margin-bottom:7px;
    }

    .status.error{
      border-color:#8b303044;
    }

    /* FOOTER */

    footer{
      border-top:1px solid #ffffff12;
      padding:28px 0;
      color:#666;
      text-align:center;
      font-size:13px;
    }

    /* MOBILE */

    @media(max-width:850px){

      .links{
        display:none;
        position:absolute;
        top:76px;
        left:0;
        right:0;
        background:#080808;
        border-bottom:1px solid #ffffff12;
        padding:20px;
        flex-direction:column;
        align-items:stretch;
      }

      .links.show{
        display:flex;
      }

      .links > a{
        padding:9px 0;
      }

      .user-area{
        margin:5px 0 0;
        padding:15px 0 0;
        border-left:0;
        border-top:1px solid #ffffff12;
        justify-content:space-between;
        flex-wrap:wrap;
      }

      .menu-btn{
        display:block;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .thumb{
        height:220px;
      }

    }

    @media(min-width:851px) and (max-width:1050px){

      .grid{
        grid-template-columns:repeat(2,1fr);
      }

    }

  </style>

</head>

<body>

<header>

  <div class="container nav">

    <a
      class="brand"
      href="index.html">

      <span class="crown">♛</span>

      EMPIRE

    </a>


    <button
      class="menu-btn"
      id="menuBtn"
      onclick="toggleMenu()">

      ☰

    </button>


    <nav
      class="links"
      id="navLinks">

      <a href="index.html">
        Home
      </a>

      <a href="index.html#videos">
        Videos
      </a>

      <a
        href="premium.html"
        class="active">

        Premium

      </a>

      <a href="about.html">
        About
      </a>


      <div class="user-area">

        <a href="profile.html">
          Profile
        </a>

        <span
          class="user-name"
          id="userName">

          Loading...

        </span>

        <button
          class="logout-btn"
          onclick="logout()">

          Logout

        </button>

      </div>

    </nav>

  </div>

</header>


<main>

  <div class="container">

    <div class="page-head">

      <div class="eyebrow">
        Exclusive Content
      </div>

      <h1>
        Premium
        <span class="gold">
          Videos
        </span>
      </h1>

      <p>
        Explore exclusive Empire videos.
        Unlock premium content securely with USDT.
      </p>

    </div>


    <div
      class="grid"
      id="premiumVideoGrid">

      <div class="status">

        <strong>
          Loading premium videos...
        </strong>

        Please wait.

      </div>

    </div>

  </div>

</main>


<footer>

  © 2026 Empire. All rights reserved.

</footer>


<script>

  /* SUPABASE */

  const SUPABASE_URL =
    "https://vubjkwbkuwndkjqfnyom.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* HELPERS */

  function escapeHtml(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  function escapeAttribute(value){

    return escapeHtml(value);

  }


  /* AUTH */

  async function checkAuth(){

    const {
      data:{
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if(!session){

      window.location.href =
        "login.html";

      return null;

    }


    return session;

  }


  /* USER PROFILE */

  async function loadUser(){

    const {
      data:{
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    if(!user){
      return;
    }


    const {
      data:profile
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          username,
          display_name
        `)
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    const userName =
      document.getElementById(
        "userName"
      );


    if(userName){

      userName.textContent =
        profile?.display_name ||
        profile?.username ||
        user.email ||
        "User";

    }

  }


  /* LOAD PREMIUM VIDEOS */

  async function loadPremiumVideos(){

    const grid =
      document.getElementById(
        "premiumVideoGrid"
      );


    if(!grid){
      return;
    }


    grid.innerHTML = `
      <div class="status">
        <strong>
          Loading premium videos...
        </strong>
        Please wait.
      </div>
    `;


    try{

      const {
        data,
        error
      } =
        await supabaseClient
          .from("videos")
          .select(`
            id,
            title,
            description,
            thumbnail_url,
            access_type,
            price,
            created_at
          `)
          .eq(
            "access_type",
            "paid"
          )
          .order(
            "created_at",
            {
              ascending:false
            }
          );


      if(error){
        throw error;
      }


      const premiumVideos =
        data || [];


      if(
        premiumVideos.length === 0
      ){

        grid.innerHTML = `
          <div class="status">

            <strong>
              No premium videos yet
            </strong>

            Premium content will
            appear here soon.

          </div>
        `;

        return;

      }


      grid.innerHTML =
        premiumVideos
          .map(
            (video,index) => {

              const thumbClass =
                index % 3 === 1
                  ? "two"
                  : index % 3 === 2
                    ? "three"
                    : "";


              const thumbnail =
                video.thumbnail_url
                  ? `
                    <img
                      src="${escapeAttribute(
                        video.thumbnail_url
                      )}"
                      alt="${escapeAttribute(
                        video.title
                      )}"
                      loading="lazy">
                  `
                  : "";


              const price =
                Number(
                  video.price || 0
                );


              return `
                <article class="card">

                  <div
                    class="thumb ${thumbClass}">

                    ${thumbnail}

                    ${
                      thumbnail
                        ? `
                          <div
                            class="thumb-overlay">
                          </div>
                        `
                        : ""
                    }

                    <span
                      class="price-badge">

                      💰
                      ${price.toFixed(2)}
                      USDT

                    </span>


                    <span
                      class="lock-icon">

                      🔒

                    </span>

                  </div>


                  <div class="card-body">

                    <h3>
                      ${escapeHtml(
                        video.title
                      )}
                    </h3>


                    <p>
                      ${escapeHtml(
                        video.description ||
                        "Exclusive Empire premium video."
                      )}
                    </p>


                    <div
                      class="card-foot">

                      <span class="tag">
                        Premium
                      </span>


                      <button
                        class="btn btn-gold"
                        onclick="openBuy(
                          '${video.id}'
                        )">

                        Buy Now

                      </button>

                    </div>

                  </div>

                </article>
              `;

            }
          )
          .join("");


    }catch(error){

      console.error(
        "PREMIUM VIDEOS ERROR:",
        error
      );


      grid.innerHTML = `
        <div
          class="status error">

          <strong>
            Could not load premium videos
          </strong>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </div>
      `;

    }

  }


  /* PAYMENT */

  async function openBuy(videoId){

    try{

      const {
        data:{
          session
        }
      } =
        await supabaseClient
          .auth
          .getSession();


      if(!session){

        window.location.href =
          "login.html";

        return;

      }


      const response =
        await fetch(
          SUPABASE_URL +
          "/functions/v1/create-purchase",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " +
                session.access_token
            },

            body:JSON.stringify({
              video_id:videoId
            })
          }
        );


      const result =
        await response.json();


      if(!response.ok){

        throw new Error(
          result.error ||
          "Could not create purchase."
        );

      }


      if(
        result.already_paid
      ){

        alert(
          "You already purchased this video."
        );

        return;

      }


      const expiresAt =
        result.expires_at
          ? new Date(
              result.expires_at
            )
          : null;


      const modal =
        document.createElement(
          "div"
        );


      modal.id =
        "empirePaymentModal";


      modal.style.cssText = `
        position:fixed;
        inset:0;
        z-index:9999;
        background:#000b;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
      `;


      modal.innerHTML = `

        <div
          style="
            width:min(520px,100%);
            background:#111;
            border:1px solid #ffffff18;
            border-radius:18px;
            padding:25px;
            box-shadow:0 20px 70px #000;
          ">

          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              gap:15px;
            ">

            <div>

              <div
                style="
                  color:#d6a535;
                  font-size:12px;
                  font-weight:800;
                  letter-spacing:1px;
                  margin-bottom:6px;
                ">

                EMPIRE PAYMENT

              </div>

              <h2>
                Unlock Premium Video
              </h2>

            </div>


            <button
              id="closePaymentModal"
              style="
                background:#191919;
                border:1px solid #ffffff15;
                color:#fff;
                width:38px;
                height:38px;
                border-radius:50%;
                cursor:pointer;
                font-size:18px;
              ">

              ×

            </button>

          </div>


          <div
            style="
              margin-top:20px;
              background:#0b0b0b;
              border:1px solid #ffffff12;
              border-radius:14px;
              padding:17px;
            ">

            <div
              style="
                display:flex;
                justify-content:space-between;
                margin-bottom:10px;
              ">

              <span>
                Amount
              </span>

              <strong
                style="color:#d6a535">

                ${Number(
                  result.amount || 0
                ).toFixed(2)}
                USDT

              </strong>

            </div>


            <div
              style="
                display:flex;
                justify-content:space-between;
              ">

              <span>
                Network
              </span>

              <strong>
                TRON (TRC20)
              </strong>

            </div>

          </div>


          <div
            style="
              margin-top:18px;
            ">

            <label
              style="
                display:block;
                color:#aaa;
                font-size:13px;
                margin-bottom:8px;
              ">

              Payment Address

            </label>


            <div
              style="
                display:flex;
                gap:8px;
              ">

              <input
                id="paymentAddress"
                readonly
                value="${escapeAttribute(
                  result.payment_address
                )}"
                style="
                  flex:1;
                  min-width:0;
                  background:#080808;
                  color:#fff;
                  border:1px solid #ffffff18;
                  border-radius:10px;
                  padding:12px;
                  font-size:12px;
                ">


              <button
                id="copyPaymentAddress"
                class="btn btn-gold">

                Copy

              </button>

            </div>

          </div>


          <div
            style="
              margin-top:16px;
              color:#aaa;
              font-size:13px;
            ">

            Time remaining:

            <strong
              id="paymentCountdown"
              style="color:#d6a535">

              30:00

            </strong>

          </div>


          <div
            style="
              margin-top:18px;
            ">

            <label
              style="
                display:block;
                color:#aaa;
                font-size:13px;
                margin-bottom:8px;
              ">

              Transaction ID (TXID)

            </label>


            <input
              id="paymentTxid"
              placeholder="Paste your TRON TXID"
              style="
                width:100%;
                background:#080808;
                color:#fff;
                border:1px solid #ffffff18;
                border-radius:10px;
                padding:13px;
                outline:none;
              ">

          </div>


          <button
            id="verifyPaymentBtn"
            class="btn btn-gold"
            style="
              width:100%;
              margin-top:16px;
            ">

            Verify Payment

          </button>


          <div
            id="paymentStatus"
            style="
              margin-top:14px;
              text-align:center;
              color:#777;
              font-size:13px;
              line-height:1.6;
            ">

            Send the exact amount to the
            address above, then enter your TXID.

          </div>

        </div>

      `;


      document.body.appendChild(
        modal
      );


      const closeBtn =
        document.getElementById(
          "closePaymentModal"
        );


      closeBtn.onclick =
        () => {

          modal.remove();

        };


      modal.addEventListener(
        "click",
        event => {

          if(
            event.target === modal
          ){

            modal.remove();

          }

        }
      );


      const copyBtn =
        document.getElementById(
          "copyPaymentAddress"
        );


      copyBtn.onclick =
        async () => {

          const address =
            result.payment_address;

          try{

            await navigator.clipboard.writeText(
              address
            );

            copyBtn.textContent =
              "Copied!";

            setTimeout(
              () => {
                copyBtn.textContent =
                  "Copy";
              },
              1500
            );

          }catch(error){

            const input =
              document.getElementById(
                "paymentAddress"
              );

            input.select();

            document.execCommand(
              "copy"
            );

            copyBtn.textContent =
              "Copied!";

          }

        };


      const countdown =
        document.getElementById(
          "paymentCountdown"
        );


      let timer;


      function updateCountdown(){

        if(!expiresAt){

          return;

        }


        const remaining =
          expiresAt.getTime() -
          Date.now();


        if(remaining <= 0){

          countdown.textContent =
            "Expired";

          clearInterval(
            timer
          );

          return;

        }


        const totalSeconds =
          Math.floor(
            remaining / 1000
          );


        const minutes =
          Math.floor(
            totalSeconds / 60
          );


        const seconds =
          totalSeconds % 60;


        countdown.textContent =
          String(minutes).padStart(
            2,
            "0"
          ) +
          ":" +
          String(seconds).padStart(
            2,
            "0"
          );

      }


      updateCountdown();


      timer =
        setInterval(
          updateCountdown,
          1000
        );


      const verifyBtn =
        document.getElementById(
          "verifyPaymentBtn"
        );


      const status =
        document.getElementById(
          "paymentStatus"
        );


      verifyBtn.onclick =
        async () => {

          const txid =
            document.getElementById(
              "paymentTxid"
            ).value.trim();


          if(!txid){

            status.textContent =
              "Please enter your TXID.";

            return;

          }


          verifyBtn.disabled =
            true;

          verifyBtn.textContent =
            "Checking...";


          status.textContent =
            "Verifying your payment...";


          try{

            const verifyResponse =
              await fetch(
                SUPABASE_URL +
                "/functions/v1/verify-payment",
                {
                  method:"POST",

                  headers:{
                    "Content-Type":
                      "application/json",

                    "Authorization":
                      "Bearer " +
                      session.access_token
                  },

                  body:JSON.stringify({
                    purchase_id:
                      result.purchase_id,

                    txid:txid
                  })
                }
              );


            const verifyResult =
              await verifyResponse.json();


            if(!verifyResponse.ok){

              throw new Error(
                verifyResult.error ||
                "Payment verification failed."
              );

            }


            status.style.color =
              "#65d391";

            status.textContent =
              "Payment confirmed. Your video is now unlocked.";


            verifyBtn.textContent =
              "Payment Confirmed";


            clearInterval(
              timer
            );


            setTimeout(
              () => {

                modal.remove();

                alert(
                  "Payment successful. You can now access the video from Home."
                );

              },
              1200
            );


          }catch(error){

            status.style.color =
              "#e06b6b";

            status.textContent =
              error.message ||
              "Payment verification failed.";


            verifyBtn.disabled =
              false;

            verifyBtn.textContent =
              "Verify Payment";

          }

        };

    }catch(error){

      console.error(
        "BUY ERROR:",
        error
      );

      alert(
        error.message ||
        "Could not start purchase."
      );

    }

  }


  /* LOGOUT */

  async function logout(){

    await supabaseClient
      .auth
      .signOut();

    window.location.href =
      "login.html";

  }


  /* MOBILE MENU */

  function toggleMenu(){

    const links =
      document.getElementById(
        "navLinks"
      );

    if(links){

      links.classList.toggle(
        "show"
      );

    }

  }


  /* START */

  (async function(){

    const session =
      await checkAuth();


    if(!session){
      return;
    }


    await loadUser();

    await loadPremiumVideos();

  })();

</script>
