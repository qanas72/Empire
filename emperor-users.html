<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMPIRE | User Oversight</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f4f4f4;font-family:Arial,sans-serif}.top{padding:14px 4%;border-bottom:1px solid #40341e;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{color:#ffe39a;font-weight:900;text-decoration:none;letter-spacing:1px}.nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.nav a,.back{color:#e8c36b;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}.wrap{width:min(1150px,94%);margin:24px auto 50px}h1{font-size:clamp(24px,5vw,34px);margin:8px 0}.muted{color:#aaa;font-size:13px;line-height:1.6}.panel{border:1px solid rgba(245,217,139,.65);border-radius:12px;padding:14px;margin:14px 0;background:transparent}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{min-width:0;flex:1;background:#111;color:#fff;border:1px solid #554629;border-radius:8px;padding:11px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #30291c;font-size:12px;vertical-align:middle}th{color:#e8c36b;font-size:11px;letter-spacing:.5px}.person{display:flex;align-items:center;gap:9px;min-width:180px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #80642f;background:#17130c}.name{font-weight:700}.handle,.small{color:#999;font-size:11px;margin-top:3px}.tag{display:inline-block;border:1px solid #65512d;border-radius:20px;padding:4px 7px;color:#e8c36b;font-size:10px}.online{color:#73d69d}.offline{color:#999}.inactive{color:#ff9999}.warn{border:1px solid #80642f;background:#241b0b;color:#ffe39a;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer}.empty{padding:22px;text-align:center;color:#aaa;border:1px dashed #554629;border-radius:9px}.count{color:#e8c36b;font-size:12px}@media(max-width:600px){.top{align-items:flex-start}.wrap{width:94%}.panel{padding:10px}}
</style>
<link rel="stylesheet" href="empire-global-menu.css">
<script src="empire-global-menu.js" defer></script>
</head><body>
<header class="top"><a class="brand" href="admin.html">♛ EMPIRE — EMPEROR PANEL</a><nav class="nav"><button class="back" type="button" onclick="history.length>1?history.back():location.href='admin.html'">← Back</button><a href="admin.html">⚙️ Dashboard</a><a href="publishing-admin.html">Reports</a></nav></header>
<main class="wrap"><h1>♛ User Oversight</h1><p class="muted">Administrator-only member directory. Search accounts, review membership and presence, and issue account warnings.</p><div id="message" class="muted">Verifying administrator access…</div>
<section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="Search username or display name…"><select id="statusFilter"><option value="all">All account statuses</option><option value="active">Active accounts</option><option value="inactive">Inactive accounts</option></select><select id="membershipFilter"><option value="all">All memberships</option><option value="VIP">VIP</option><option value="Regular">Regular</option></select></div><div class="count" id="count"></div><div class="table-wrap"><table><thead><tr><th>USER</th><th>MEMBERSHIP</th><th>ACCOUNT</th><th>PRESENCE</th><th>JOINED</th><th>ACTION</th></tr></thead><tbody id="users"><tr><td colspan="6" class="muted">Loading users…</td></tr></tbody></table></div></section></main>
<script>
const db=window.supabase.createClient("https://vubjkwbkuwndkjqfnyom.supabase.co","sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ");
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const fallback="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%23222222'/%3E%3Ctext x='40' y='52' text-anchor='middle' font-size='38' fill='%23e8c36b'%3E%E2%98%BB%3C/text%3E%3C/svg%3E";
let rows=[],presence={};
function avatarUrl(path){return path?db.storage.from("avatars").getPublicUrl(path).data?.publicUrl||fallback:fallback;}
function render(){const q=$("search").value.trim().toLowerCase(),sf=$("statusFilter").value,mf=$("membershipFilter").value;const filtered=rows.filter(u=>{const text=((u.display_name||"")+" "+(u.username||"")).toLowerCase();return (!q||text.includes(q))&&(sf==="all"||(sf==="active"?u.is_active:u.is_active===false))&&(mf==="all"||u.membership_type===mf);});$("count").textContent=filtered.length+" of "+rows.length+" accounts";if(!filtered.length){$("users").innerHTML='<tr><td colspan="6"><div class="empty">No matching accounts.</div></td></tr>';return;}$("users").innerHTML=filtered.map(u=>'<tr><td><div class="person"><img class="avatar" src="'+esc(avatarUrl(u.avatar_url))+'" alt=""><div><div class="name">'+esc(u.display_name||"Member")+'</div><div class="handle"><a style="color:#e8c36b;text-decoration:underline" href="user-profile.html?username='+encodeURIComponent(u.username||"")+"&admin=1"+'" target="_blank" rel="noopener">@'+esc(u.username||"no-username")+' ↗</a></div></div></div></td><td><span class="tag">'+(u.membership_type==="VIP"?"♛ VIP":"Regular")+'</span>'+(u.active_vip_plan?'<div class="small">'+esc(u.active_vip_plan)+'</div>':"")+'</td><td class="'+(u.is_active?"online":"inactive")+'">'+(u.is_active?"Active":"Inactive")+'</td><td class="'+(presence[u.user_id]?"online":"offline")+'">'+(presence[u.user_id]?"● Online":"○ Offline")+'</td><td>'+new Date(u.created_at).toLocaleDateString()+'</td><td><button class="warn" data-warn="'+esc(u.user_id)+'">Send warning</button></td></tr>').join("");$("users").querySelectorAll("[data-warn]").forEach(b=>b.onclick=()=>sendWarning(b.dataset.warn));}
async function sendWarning(userId){const message=prompt("Write an account warning (5–2000 characters):");if(message===null)return;if(message.trim().length<5||message.trim().length>2000){alert("Warning must be 5–2000 characters.");return;}const {data:{user:admin}}=await db.auth.getUser();const {error}=await db.from("user_warnings").insert({user_id:userId,admin_id:admin.id,message:message.trim()});if(error){alert("Could not send warning: "+error.message);return;}alert("Warning sent successfully.");}
async function loadPresence(){presence={};const ids=rows.map(u=>u.user_id);for(let i=0;i<ids.length;i+=100){const {data,error}=await db.from("user_presence").select("user_id,last_seen").in("user_id",ids.slice(i,i+100));if(error){console.warn("Presence unavailable",error);return;}const cutoff=Date.now()-120000;(data||[]).forEach(p=>presence[p.user_id]=new Date(p.last_seen).getTime()>cutoff);} }
async function init(){const {data:sessionData,error:sessionError}=await db.auth.getSession();if(sessionError||!sessionData.session){location.href="login.html";return;}const {data:isAdmin,error:adminError}=await db.rpc("is_admin");if(adminError||isAdmin!==true){$("message").textContent="Admin access denied.";return;}const {data,error}=await db.rpc("admin_get_user_directory");if(error){$("message").textContent="Could not load user directory: "+error.message+" — run emperor-user-directory-setup.sql in Supabase.";return;}rows=data||[];await loadPresence();$("message").textContent="Secure directory loaded. Account profiles are visible only to administrators.";render();}
$("search").addEventListener("input",render);$("statusFilter").addEventListener("change",render);$("membershipFilter").addEventListener("change",render);init();
</script></body></html>
