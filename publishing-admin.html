<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMPIRE | Content Reports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f4f4f4;font-family:Arial,sans-serif}.wrap{width:min(1000px,92%);margin:30px auto}.top{padding:16px 4%;border-bottom:1px solid #40341e;display:flex;justify-content:space-between}.gold{color:#e8c36b}a{color:#e8c36b;text-decoration:none}.card{background:#151515;border:1px solid #40341e;border-radius:13px;padding:18px;margin:15px 0}.report{border-bottom:1px solid #333;padding:15px 0}.muted{color:#aaa;font-size:13px;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:10px 13px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.remove{background:#6d2525;color:white}.dismiss{background:#cda64e;color:#111}.status{color:#e8c36b}</style></head><body>
<header class="top"><strong class="gold">♛ EMPIRE — REPORT REVIEW</strong><nav style="display:flex;gap:14px;flex-wrap:wrap"><a href="admin.html">Video Admin</a><a href="vip-admin.html">VIP Admin</a><a href="publishing.html">Publishing</a></nav></header><main class="wrap"><h1>Publication reports</h1><p class="muted">Review user reports. Removing a publication hides it from the public feed; dismissing a report leaves the publication visible.</p><div id="message" class="muted">Verifying administrator access...</div><section id="reports" class="card"></section></main>
<script>
const db=window.supabase.createClient("https://vubjkwbkuwndkjqfnyom.supabase.co","sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ");
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function init(){
 const {data,error}=await db.auth.getSession();if(error||!data.session){location.href="login.html";return;}
 const {data:isAdmin,error:adminError}=await db.rpc("is_admin");
 if(adminError||isAdmin!==true){ $("message").textContent="Admin access denied.";return;}
 $("message").textContent="Signed in as administrator.";
 await loadReports();
}
async function loadReports(){
 const {data,error}=await db.from("post_reports").select("id,post_id,reason,created_at,status,community_posts(id,author_name,content,image_path,is_removed)").eq("status","pending").order("created_at",{ascending:false});
 if(error){$("reports").textContent="Could not load reports. Ensure publishing-setup.sql has been run.";return;}
 if(!data.length){$("reports").textContent="No pending reports.";return;}
 $("reports").innerHTML=data.map(r=>'<article class="report"><p class="status">Report • '+new Date(r.created_at).toLocaleString()+'</p><p><b>Reason:</b> '+esc(r.reason)+'</p><p><b>Publication by:</b> '+esc(r.community_posts?.author_name||"Unknown")+'</p><p class="muted">'+esc(r.community_posts?.content||"[Image-only publication]")+'</p><p class="muted">Publication ID: '+esc(r.post_id)+'</p><div class="actions"><button class="remove" data-remove="'+r.post_id+'" data-report="'+r.id+'">Remove publication</button><button class="dismiss" data-dismiss="'+r.id+'">Dismiss report</button></div></article>').join("");
 $("reports").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>moderate(b.dataset.report,b.dataset.remove,true));
 $("reports").querySelectorAll("[data-dismiss]").forEach(b=>b.onclick=()=>moderate(b.dataset.dismiss,null,false));
}
async function moderate(reportId,postId,remove){
 const decision=remove?"Remove this publication from public view?":"Dismiss this report?";
 if(!confirm(decision))return;
 if(remove){const {error}=await db.from("community_posts").update({is_removed:true}).eq("id",postId);if(error){alert(error.message);return;}}
 const {error}=await db.from("post_reports").update({status:remove?"action_taken":"dismissed",reviewed_by:(await db.auth.getUser()).data.user.id,reviewed_at:new Date().toISOString()}).eq("id",reportId);
 if(error){alert(error.message);return;}await loadReports();
}
init();
</script></body></html>
