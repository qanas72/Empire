<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMPIRE | Content Reports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f4f4f4;font-family:Arial,sans-serif}.wrap{width:min(1000px,92%);margin:30px auto}.top{padding:16px 4%;border-bottom:1px solid #40341e;display:flex;justify-content:space-between}.gold{color:#e8c36b}a{color:#e8c36b;text-decoration:none}.card{background:#151515;border:1px solid #40341e;border-radius:13px;padding:18px;margin:15px 0}.report{border-bottom:1px solid #333;padding:15px 0}.muted{color:#aaa;font-size:13px;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:10px 13px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.remove{background:#6d2525;color:white}.dismiss{background:#cda64e;color:#111}.status{color:#e8c36b}
/* Shared Empire crown and wordmark — match the public homepage */
.brand-mark{
 display:inline-block;font-size:30px;margin-right:8px;
 filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 9px rgba(255,40,160,.8)) drop-shadow(0 0 14px rgba(80,180,255,.65));
 transform:perspective(300px) rotateY(-12deg);
 animation:crownGlow 3s ease-in-out infinite alternate;
}
.brand-name{
 color:#ffe39a;font-weight:900;letter-spacing:1px;
 text-shadow:0 0 5px rgba(255,215,0,.8),0 0 12px rgba(255,70,170,.35);
}
@keyframes crownGlow{
 from{filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 7px rgba(255,40,160,.5));transform:perspective(300px) rotateY(-12deg) translateY(0)}
 to{filter:drop-shadow(0 0 8px #ffd700) drop-shadow(0 0 13px rgba(255,40,160,.9)) drop-shadow(0 0 17px rgba(80,180,255,.7));transform:perspective(300px) rotateY(12deg) translateY(-2px)}
}
@media(max-width:600px){.brand-mark{font-size:27px}.brand-name{letter-spacing:.7px}}
.report-brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand-subtitle{color:#e8c36b;font-weight:700;font-size:13px;letter-spacing:1px}
/* EMPIRE unified transparent cards — gold outline only */
:is(.card,.panel,.box,.vip-card,.feature-box,.feature-card,.stat-card,.profile-about,.date-box,.list-item,.video-row,.video-info,.access-box,.form-section,.status-box,.video-item,.post){
  background:transparent!important;
  background-image:none!important;
  border:1px solid rgba(245,217,139,.82)!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}

</style>
<link rel="stylesheet" href="empire-global-menu.css">
<script src="empire-global-menu.js" defer></script>
</head><body>
<header class="top"><div class="report-brand"><a class="brand" href="index.html" aria-label="Empire Home"><span class="brand-mark" aria-hidden="true">👑</span><span class="brand-name">𝑬𝒎𝒑𝒊𝒓𝒆</span></a><span class="brand-subtitle">— REPORT REVIEW</span></div><nav style="display:flex;gap:14px;flex-wrap:wrap"><button type="button" onclick="history.length>1?history.back():location.href='admin.html'" style="background:transparent;border:0;color:#e8c36b;cursor:pointer;font:inherit">← Back</button><a href="admin.html">Video Admin</a><a href="vip-admin.html">VIP Admin</a><a href="publishing.html">Publishing</a></nav></header><main class="wrap"><h1>Publication reports</h1><p class="muted">Review user reports. Removing a publication hides it from the public feed; dismissing a report leaves the publication visible.</p><div id="message" class="muted">Verifying administrator access...</div><section id="reports" class="card"></section></main>
<script>
const db=window.supabase.createClient("https://vubjkwbkuwndkjqfnyom.supabase.co","sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ");
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function init(){
 const {data,error}=await db.auth.getSession();if(error||!data.session){location.href="login.html";return;}
 const {data:isAdmin,error:adminError}=await db.rpc("is_admin");
 if(adminError||isAdmin!==true){ $("message").textContent="Admin access denied.";return;}
 $("message").textContent="Signed in as administrator.";
 await loadReports();
}
function profileCard(userId,profile,label){
 if(!userId)return '<div class="muted">'+label+': unavailable</div>';
 const p=profile||{};
 const photo=p.avatar_url?db.storage.from("avatars").getPublicUrl(p.avatar_url).data?.publicUrl:"";
 const img=photo?'<img src="'+esc(photo)+'" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:50%;border:1px solid #80642f">':'<div style="width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid #80642f;color:#e8c36b">♙</div>';
 return '<div style="display:flex;align-items:center;gap:10px;min-width:220px">'+img+'<div><div><b>'+esc(p.display_name||"Unknown user")+'</b></div><div class="muted"><a href="user-profile.html?username='+encodeURIComponent(p.username||"")+"&admin=1"+'" target="_blank" rel="noopener">@'+esc(p.username||"unavailable")+' ↗</a></div><div class="muted">'+esc(p.membership_type||"Account")+' · '+(p.is_active?"Active":"Inactive")+'</div><div class="actions" style="margin-top:5px"><button class="dismiss" data-warn="'+esc(userId)+'">Send warning</button></div></div></div>';
}
async function loadReports(){
 const {data,error}=await db.from("post_reports").select("id,post_id,reporter_id,reason,created_at,status,community_posts(id,author_id,author_name,content,image_path,image_paths,is_removed)").eq("status","pending").order("created_at",{ascending:false});
 if(error){$("reports").textContent="Could not load reports: "+error.message;return;}
 if(!data?.length){$("reports").textContent="No pending reports.";return;}
 const ids=[...new Set(data.flatMap(r=>[r.reporter_id,r.community_posts?.author_id]).filter(Boolean))];
 const {data:profiles,error:profileError}=await db.rpc("admin_get_user_directory",{p_user_ids:ids});
 if(profileError){$("reports").textContent="Reports loaded, but user profiles could not be retrieved: "+profileError.message+". Run emperor-user-directory-setup.sql.";return;}
 const profileMap=Object.fromEntries((profiles||[]).map(p=>[p.user_id,p]));
 $("reports").innerHTML=data.map(r=>{
  const post=r.community_posts||{};
  const paths=[...(Array.isArray(post.image_paths)?post.image_paths:[]),...(post.image_path&&!(post.image_paths||[]).includes(post.image_path)?[post.image_path]:[])];
  const images=paths.map(path=>{const url=db.storage.from("post-images").getPublicUrl(path).data?.publicUrl;return url?'<img src="'+esc(url)+'" alt="Reported publication image" loading="lazy" style="display:block;max-width:100%;max-height:360px;object-fit:contain;margin:12px 0;border:1px solid #80642f;border-radius:10px">':"";}).join("");
  return '<article class="report"><p class="status">Report • '+new Date(r.created_at).toLocaleString()+'</p><p><b>Reason:</b> '+esc(r.reason)+'</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:12px 0"><div><p class="status">REPORTED USER</p>'+profileCard(post.author_id,profileMap[post.author_id],"Reported user")+'</div><div><p class="status">REPORTER</p>'+profileCard(r.reporter_id,profileMap[r.reporter_id],"Reporter")+'</div></div><p><b>Publication by:</b> '+esc(post.author_name||"Unknown")+'</p><p class="muted">'+esc(post.content||"[Image-only publication]")+'</p>'+images+'<p class="muted">Publication ID: '+esc(r.post_id)+'</p><div class="actions"><button class="remove" data-remove="'+r.post_id+'" data-report="'+r.id+'">Remove publication</button><button class="dismiss" data-dismiss="'+r.id+'">Dismiss report</button></div></article>';
 }).join("");
 $("reports").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>moderate(b.dataset.report,b.dataset.remove,true));
 $("reports").querySelectorAll("[data-dismiss]").forEach(b=>b.onclick=()=>moderate(b.dataset.dismiss,null,false));
 $("reports").querySelectorAll("[data-warn]").forEach(b=>b.onclick=()=>sendUserWarning(b.dataset.warn));
}
async function sendUserWarning(userId){
 const message=prompt("Write a warning message for this user (5–2000 characters):");
 if(message===null)return;
 if(message.trim().length<5||message.trim().length>2000){alert("Warning must be 5–2000 characters.");return;}
 const {data:{user:admin}}=await db.auth.getUser();
 const {error}=await db.from("user_warnings").insert({user_id:userId,admin_id:admin.id,message:message.trim()});
 if(error){alert("Could not send warning: "+error.message);return;}
 alert("Warning sent to the user's account.");
}
async function moderate(reportId,postId,remove){
 const decision=remove?"Remove this publication from public view?":"Dismiss this report?";
 if(!confirm(decision))return;
 if(remove){const {error}=await db.from("community_posts").update({is_removed:true}).eq("id",postId);if(error){alert(error.message);return;}}
 const {error}=await db.from("post_reports").update({status:remove?"action_taken":"dismissed",reviewed_by:(await db.auth.getUser()).data.user.id,reviewed_at:new Date().toISOString()}).eq("id",reportId);
 if(error){alert(error.message);return;}await loadReports();
}
init();
</script></body></html>
