<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMPIRE | Notifications</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}.top{padding:15px 4%;border-bottom:1px solid #66502b;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:#e8c36b;text-decoration:none;font-weight:bold}.btn{padding:10px 14px;border:1px solid #80642f;border-radius:8px;background:#181818;color:#e8c36b;cursor:pointer;text-decoration:none}.wrap{width:min(850px,94%);margin:26px auto}h1{color:#e8c36b}.muted{color:#aaa;font-size:13px;line-height:1.7}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.notice{border:1px solid #5c4826;border-radius:10px;padding:15px;margin:10px 0;background:#101010}.notice.unread{border-left:4px solid #e8c36b;background:#17130c}.notice h3{font-size:16px;margin:0 0 8px;color:#f0d18a}.notice p{line-height:1.6;margin:0 0 9px;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:#999}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:30px;border:1px dashed #66502b;border-radius:10px;color:#aaa}.count{color:#e8c36b}
</style></head><body><header class="top"><a class="brand" href="index.html">♛ EMPIRE</a><button class="btn" onclick="history.length>1?history.back():location.href='profile.html'">← Back</button></header><main class="wrap"><h1>♧ Notifications</h1><p class="muted">Messages, account warnings, support replies, raffle results and important account updates.</p><div class="toolbar"><button class="btn" id="refresh">Refresh</button><button class="btn" id="readAll">Mark all as read</button><span class="muted" id="summary"></span></div><div id="notice" class="muted">Checking your account...</div><section id="items"><div class="empty">Loading notifications...</div></section></main>
<script>
const db=window.supabase.createClient("https://vubjkwbkuwndkjqfnyom.supabase.co","sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ");
const box=document.getElementById("items"),notice=document.getElementById("notice"),summary=document.getElementById("summary");let user=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function load(){
 if(!user)return;box.innerHTML='<div class="empty">Loading...</div>';
 const {data,error}=await db.from("empire_notifications").select("id,notification_type,title,body,target_url,created_at,read_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100);
 if(error){box.innerHTML='<div class="empty">Could not load notifications: '+esc(error.message)+'</div>';return;}
 const unread=(data||[]).filter(n=>!n.read_at).length;summary.innerHTML='<span class="count">'+unread+'</span> unread · '+(data?.length||0)+' total';
 if(!data?.length){box.innerHTML='<div class="empty">You have no notifications yet.</div>';return;}
 const icons={new_message:"💬",admin_warning:"⚠️",raffle_winner:"🏆",support_reply:"🎧",account_update:"👤",wallet_update:"💰",video_review:"🎬",vip_request_update:"👑"};
 box.innerHTML=data.map(n=>'<article class="notice '+(!n.read_at?'unread':'')+'"><h3>'+ (icons[n.notification_type]||"🔔")+' '+esc(n.title)+'</h3><p>'+esc(n.body)+'</p><div class="meta">'+new Date(n.created_at).toLocaleString()+' · '+(n.read_at?'Read':'Unread')+'</div><div class="actions"><a class="btn" href="'+esc(n.target_url||"notifications.html")+'" data-id="'+esc(n.id)+'">Open</a>'+(!n.read_at?'<button class="btn" data-read="'+esc(n.id)+'">Mark as read</button>':'')+'</div></article>').join("");
 box.querySelectorAll("[data-read]").forEach(b=>b.addEventListener("click",()=>markRead(b.dataset.read)));
 box.querySelectorAll("a[data-id]").forEach(a=>a.addEventListener("click",async()=>{const n=data.find(x=>x.id===a.dataset.id);if(n&&!n.read_at)await db.from("empire_notifications").update({read_at:new Date().toISOString()}).eq("id",n.id).eq("user_id",user.id);}));
}
async function markRead(id){const {error}=await db.from("empire_notifications").update({read_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);if(error){notice.textContent=error.message;return;}await load();}
document.getElementById("refresh").onclick=load;
document.getElementById("readAll").onclick=async()=>{const {error}=await db.from("empire_notifications").update({read_at:new Date().toISOString()}).eq("user_id",user.id).is("read_at",null);if(error){notice.textContent=error.message;return;}notice.textContent="All notifications marked as read.";await load();};
(async()=>{const {data,error}=await db.auth.getSession();user=data?.session?.user;if(error||!user){notice.textContent="Please sign in to view notifications.";box.innerHTML='<a class="btn" href="login.html">Sign in</a>';return;}notice.textContent="Your EMPIRE notifications.";await load();})();
</script></body></html>
