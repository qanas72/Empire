<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPIRE | Messages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#e8c36b;--line:#40341f;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;height:100dvh;min-height:0;overflow:hidden;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#000b,#000e),url("profile-background-desktop.png") center/cover no-repeat}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;background:#090909ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.back-nav{background:transparent;border:0;color:#e8c36b;padding:4px 7px;cursor:pointer;font:inherit}.brand{font-size:22px;font-weight:900;letter-spacing:2px;color:var(--gold)}.nav{display:flex;gap:18px;color:#bbb;font-size:14px}
.page-back{position:fixed;top:10px;left:12px;z-index:30;background:#15120b;border:1px solid #80642f;border-radius:9px;color:#f2d68b;padding:8px 13px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px #0008}main{width:100%;height:100dvh;margin:0;overflow:hidden}.heading{margin-bottom:20px}.heading h1{margin:0 0 6px;font-size:clamp(27px,4vw,36px)}.muted{color:var(--muted);font-size:13px;line-height:1.6}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:0;height:100%;min-height:0}.panel{background:linear-gradient(145deg,#191919f2,#0d0d0df2);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.side-head{padding:18px;border-bottom:1px solid #302817}.side-head h2{font-size:17px;margin:0 0 12px;color:var(--gold)}.search{width:100%;padding:12px 13px;background:#090909;color:white;border:1px solid #40341f;border-radius:10px;outline:none}.search:focus,.composer textarea:focus{border-color:var(--gold)}
.people{height:calc(100% - 76px);max-height:none;overflow-y:auto;overscroll-behavior:contain}.person{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;background:transparent;border:0;border-bottom:1px solid #25211a;color:white;text-align:left;cursor:pointer}.person:hover,.person.active{background:#d6ad5510}.person.active{box-shadow:inset 3px 0 var(--gold)}.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:50%;object-fit:cover;background:#292929;border:1px solid #a7833c}.person-info{min-width:0;flex:1}.person-name{font-weight:700;overflow-wrap:anywhere}.handle{font-size:11px;color:#999;margin-top:3px}.person-last{font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.chat{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}.chat-head{display:flex;align-items:center;gap:12px;padding:16px 19px;border-bottom:1px solid #302817;min-height:76px}.chat-head .avatar{width:45px;height:45px}.chat-name{font-weight:800}.chat-status{font-size:11px;color:#aaa;margin-top:4px}.balance{margin-left:auto;text-align:right;font-size:12px;color:var(--gold);white-space:nowrap}.balance small{display:block;color:#999;font-size:10px}
.thread{flex:1;min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:min(78%,560px);padding:11px 14px;border-radius:14px;background:#222;border:1px solid #393939;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.55;font-size:14px}.bubble.mine{align-self:flex-end;background:#3a2e17;border-color:#80642f}.time{display:block;margin-top:6px;font-size:10px;color:#aaa;text-align:right}
.composer{flex:0 0 auto;padding:15px 17px;border-top:1px solid #302817;background:#0b0b0b}.fee-row{display:flex;justify-content:space-between;gap:10px;color:#aaa;font-size:11px;margin-bottom:9px}.fee-row strong{color:var(--gold)}.compose-row{display:flex;gap:10px;align-items:flex-end}.composer textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:130px;padding:12px;background:#151515;color:white;border:1px solid #40341f;border-radius:10px;outline:none}.send{border:0;border-radius:10px;padding:13px 18px;background:linear-gradient(135deg,#f4d98c,#c99b3d);color:#17120a;font-weight:800;cursor:pointer}.send:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;margin:0 0 12px;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.5}.notice.show{display:block}.notice.error{background:#4a1717;color:#ffc0c0}.notice.success{background:#123a29;color:#a9f0ca}.empty{padding:30px 18px;text-align:center;color:#999;line-height:1.7;font-size:13px}.welcome{margin:auto;max-width:400px;text-align:center;padding:35px;color:#aaa;line-height:1.8}.welcome b{display:block;color:var(--gold);font-size:23px;margin-bottom:8px}.back{display:block;background:none;border:0;color:var(--gold);font-size:22px;padding:3px 8px 3px 0}
@media(max-width:760px){body:before{background:linear-gradient(#000b,#000e),url("profile-background-mobile.png") center/cover no-repeat}main{width:100%;height:100dvh;margin:0}.layout{display:block;height:100%;min-height:0}.side{border-radius:0;border-left:0;border-right:0}.people{height:calc(100% - 76px);max-height:none}.chat{display:none;height:100%;border-radius:0;border-left:0;border-right:0;min-height:0}.chat.mobile-open{display:flex}.side.mobile-hidden{display:none}.thread{max-height:none;min-height:0}.back{display:block}.bubble{max-width:88%}}

/* Shared Empire crown and wordmark — match the public homepage */
.brand-mark{
 display:inline-block;font-size:30px;margin-right:8px;
 filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 9px rgba(255,40,160,.8)) drop-shadow(0 0 14px rgba(80,180,255,.65));
 transform:perspective(300px) rotateY(-12deg);
 animation:crownGlow 3s ease-in-out infinite alternate;
}
.brand-name{
 color:#ffe39a;font-weight:900;letter-spacing:1px;
 text-shadow:0 0 5px rgba(255,215,0,.8),0 0 12px rgba(255,70,170,.35);
}
@keyframes crownGlow{
 from{filter:drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 7px rgba(255,40,160,.5));transform:perspective(300px) rotateY(-12deg) translateY(0)}
 to{filter:drop-shadow(0 0 8px #ffd700) drop-shadow(0 0 13px rgba(255,40,160,.9)) drop-shadow(0 0 17px rgba(80,180,255,.7));transform:perspective(300px) rotateY(12deg) translateY(-2px)}
}
@media(max-width:600px){.brand-mark{font-size:27px}.brand-name{letter-spacing:.7px}}

/* EMPIRE avatar image preview */
.empire-avatar-zoom{cursor:zoom-in!important}
.empire-avatar-lightbox{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.88);backdrop-filter:blur(5px)}
.empire-avatar-lightbox.is-open{display:flex}
.empire-avatar-lightbox img{display:block;max-width:min(88vw,620px);max-height:82vh;width:auto;height:auto;object-fit:contain;border-radius:16px;border:2px solid #d6ad55;box-shadow:0 18px 70px #000;animation:empireAvatarPop .18s ease-out}
.empire-avatar-lightbox button{position:absolute;top:18px;right:18px;width:42px;height:42px;border:1px solid #d6ad55;border-radius:50%;background:#17130c;color:#f5d98d;font-size:28px;line-height:1;cursor:pointer}
@keyframes empireAvatarPop{from{transform:scale(.88);opacity:.4}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.empire-avatar-lightbox img{animation:none}}

/* EMPIRE unified transparent cards — gold outline only */
:is(.card,.panel,.box,.vip-card,.feature-box,.feature-card,.stat-card,.profile-about,.date-box,.list-item,.video-row,.video-info,.access-box,.form-section,.status-box,.video-item,.post){
  background:transparent!important;
  background-image:none!important;
  border:1px solid rgba(245,217,139,.82)!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}

 .media-tools{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}.media-btn{background:#211b10;color:#f2d68b;border:1px solid #80642f;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:12px}.media-btn:disabled{opacity:.5}.vip-media-note{font-size:11px;color:#999;margin-top:9px}.message-media-image{display:block;max-width:min(100%,360px);max-height:320px;border-radius:10px;object-fit:contain}.message-media-video{display:block;width:min(100%,420px);max-height:320px;border-radius:10px;background:#000}.message-media-audio{display:block;max-width:min(100%,320px)} .message-file-link{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #80642f;border-radius:9px;color:#f2d68b;overflow-wrap:anywhere}audio::-webkit-media-controls-overflow-button,video::-webkit-media-controls-overflow-button{display:none!important}.message-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}.message-actions .time{margin:0}.delete-message{border:0;background:transparent;color:#c9a65b;font-size:10px;padding:2px 0;cursor:pointer}.delete-message:hover{color:#ffb5a8}.media-unavailable{color:#ffb7b7;font-size:12px}</style>

<body>

<button type="button" class="page-back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="Go back">🔙 Back</button><main>
<div class="layout"><aside class="panel side" id="side"><div class="side-head"><h2>Connections & Chats</h2><input id="search" class="search" type="search" placeholder="Search friends and followers..."></div><div class="people" id="people"><div class="empty">Loading members...</div></div></aside>
<section class="panel chat" id="chat"><div class="welcome"><b>♛ EMPIRE MESSAGES</b>Select a member to start a private conversation.</div></section></div></main>
<script>
const SUPABASE_URL="https://vubjkwbkuwndkjqfnyom.supabase.co";
const SUPABASE_KEY="sb_publishable_Ig1R3dpAKyBfjIGSUhhlKw_uC-QF0QQ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let me=null, members=[], selected=null, balance=0, vip=false, poller=null, chatSession=0, messageFeeRegular=5, messageFeeVip=3;
const mediaUrlCache=new Map();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const fallbackAvatar="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23222222'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='48' fill='%23e8c36b'%3E%E2%98%BB%3C/text%3E%3C/svg%3E";
function avatar(path){if(!path)return fallbackAvatar;return db.storage.from("avatars").getPublicUrl(path).data?.publicUrl||fallbackAvatar;}
function fee(){return vip?messageFeeVip:messageFeeRegular;}
async function loadEconomicSettings(){const {data,error}=await db.from("empire_economic_settings").select("setting_key,setting_value").in("setting_key",["message_fee_regular","message_fee_vip"]);if(error)throw error;(data||[]).forEach(row=>{const value=Number(row.setting_value);if(!Number.isFinite(value)||value<0)return;if(row.setting_key==="message_fee_regular")messageFeeRegular=value;if(row.setting_key==="message_fee_vip")messageFeeVip=value;});}
function showNotice(message,type="error"){const el=$("msgNotice");el.className="notice show "+type;el.textContent=message;}
function clearNotice(){$("msgNotice").className="notice";}
function stamp(v){return new Date(v).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}
function renderPeople(){const q=$("search").value.trim().toLowerCase();const list=members.filter(m=>(m.display_name+" "+m.username).toLowerCase().includes(q));if(!list.length){$("people").innerHTML='<div class="empty">No friends, followers or following found.</div>';return;}
$("people").innerHTML=list.map(m=>'<button class="person '+(selected?.id===m.id?"active":"")+'" data-id="'+esc(m.id)+'"><img class="avatar" src="'+esc(avatar(m.avatar_url))+'" alt=""><span class="person-info"><span class="person-name">'+esc(m.display_name||m.username)+'</span><span class="handle">@'+esc(m.username)+'</span></span></button>').join("");
$("people").querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openChat(b.dataset.id)));}
async function loadConnectedMembers(){const [followers,following]=await Promise.all([db.from("user_follows").select("follower_id").eq("following_id",me.id),db.from("user_follows").select("following_id").eq("follower_id",me.id)]);if(followers.error)throw followers.error;if(following.error)throw following.error;const ids=[...new Set([...(followers.data||[]).map(x=>x.follower_id),...(following.data||[]).map(x=>x.following_id)])].filter(id=>id!==me.id);if(!ids.length){members=[];return;}const {data,error}=await db.from("public_user_profiles").select("id,username,display_name,avatar_url,membership_type").in("id",ids).order("display_name");if(error)throw error;members=data||[];}
let voiceRecorder=null,voiceChunks=[];
async function sendMedia(file,type){if(!vip){showNotice("Active VIP membership is required for media messages.");return;}if(!selected)return;if(file.size>50*1024*1024){showNotice("Maximum media file size is 50 MB.");return;}if(balance<fee()){showNotice("Insufficient EMPC balance. You need at least "+fee()+" EMPC.");return;}const button=$("mediaBtn")||$("voiceBtn");if(button){button.disabled=true;button.textContent="Uploading...";}try{const ext=(file.name&&file.name.includes(".")?file.name.split(".").pop():({image:"jpg",video:"mp4",audio:"webm"}[type])).toLowerCase().replace(/[^a-z0-9]/g,"");const path=me.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;const {error:uploadError}=await db.storage.from("message-media").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});if(uploadError)throw uploadError;const {data,error}=await db.rpc("send_empire_media_message",{p_receiver_id:selected.id,p_media_type:type,p_media_path:path,p_file_name:file.name||("EMPIRE-"+type),p_mime_type:file.type||"application/octet-stream"});if(error){await db.storage.from("message-media").remove([path]);throw error;}const result=Array.isArray(data)?data[0]:data;if(result?.remaining_balance!==undefined)balance=Number(result.remaining_balance);else await loadWallet();await renderChat(false);}catch(error){console.error(error);showNotice(error.message||"Media message could not be sent.");}finally{if($("mediaBtn")){$("mediaBtn").disabled=false;$("mediaBtn").textContent="＋ Photo / Video";}if($("voiceBtn")){$("voiceBtn").disabled=false;if(!voiceRecorder)$("voiceBtn").textContent="🎙 Record voice";}if($("balanceText"))$("balanceText").innerHTML=balance.toLocaleString(undefined,{maximumFractionDigits:8})+' EMPC<small>Wallet balance</small>';}}
async function toggleVoiceRecording(){if(!vip)return;const button=$("voiceBtn");if(voiceRecorder&&voiceRecorder.state==="recording"){voiceRecorder.stop();button.disabled=true;button.textContent="Preparing voice...";return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const options=MediaRecorder.isTypeSupported("audio/webm")?{mimeType:"audio/webm"}:{};voiceRecorder=new MediaRecorder(stream,options);voiceChunks=[];voiceRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data);};voiceRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||"audio/webm"});voiceRecorder=null;if(blob.size){const ext=blob.type.includes("mp4")?"m4a":"webm";await sendMedia(new File([blob],"voice-"+Date.now()+"."+ext,{type:blob.type}),"audio");}if(button){button.disabled=false;button.textContent="🎙 Record voice";}};voiceRecorder.start();button.textContent="■ Stop voice";}catch(error){console.error(error);showNotice("Microphone access is unavailable. Please allow microphone access.");}}
async function loadWallet(){const {data,error}=await db.from("empire_wallets").select("balance").eq("user_id",me.id).eq("wallet_type","user").maybeSingle();if(error)throw error;balance=Number(data?.balance||0);}
async function loadVip(){const {data,error}=await db.from("vip_memberships").select("status,expires_at").eq("user_id",me.id).eq("status","active").gt("expires_at",new Date().toISOString()).limit(1);if(error)throw error;vip=!!data?.length;}
async function openChat(id,externalMember=null){const next=members.find(m=>m.id===id)||externalMember;if(!next)return;if(poller){clearInterval(poller);poller=null;}chatSession++;selected=next;$("chat").innerHTML="";renderPeople();$("side").classList.add("mobile-hidden");$("chat").classList.add("mobile-open");await renderChat(true);const session=chatSession;if(selected?.id===id)poller=setInterval(()=>{if(selected?.id===id&&chatSession===session&&!document.hidden)renderChat(true).catch(console.error);},15000);}
async function renderChat(quiet=false){
if(!selected)return;
const activeInput=$("messageInput");
if(quiet && activeInput && document.activeElement===activeInput)return;
const other=selected;
const {data,error}=await db.from("empire_messages").select("id,sender_id,receiver_id,content,media_type,media_path,media_file_name,media_mime_type,created_at").or('and(sender_id.eq.'+me.id+',receiver_id.eq.'+other.id+'),and(sender_id.eq.'+other.id+',receiver_id.eq.'+me.id+')').order("created_at",{ascending:false}).limit(300);
if(error)throw error;
const rows=(data||[]).reverse();
const renderedRows=await Promise.all(rows.map(async m=>{
 let body=esc(m.content||"");
 if(m.media_type&&m.media_path){
   let url=mediaUrlCache.get(m.media_path);
   if(!url){
     const options=m.media_type==="file"?{download:m.media_file_name||true}:undefined;
     const {data:signed,error:signedError}=await db.storage.from("message-media").createSignedUrl(m.media_path,3600,options);
     if(signedError){body='<span class="media-unavailable">Media unavailable</span>';}
     else{url=signed.signedUrl;mediaUrlCache.set(m.media_path,url);}
   }
   if(url){
     const safeUrl=esc(url);
     if(m.media_type==="image")body='<a href="'+safeUrl+'" target="_blank" rel="noopener"><img class="message-media-image" src="'+safeUrl+'" alt="Photo message"></a>';
     else if(m.media_type==="video")body='<video class="message-media-video" src="'+safeUrl+'" controls controlsList="nodownload" playsinline preload="metadata"></video>';
     else if(m.media_type==="audio")body='<audio class="message-media-audio" src="'+safeUrl+'" controls controlsList="nodownload" preload="metadata"></audio>';
     else body='<a class="message-file-link" href="'+safeUrl+'" target="_blank" rel="noopener" download="'+esc(m.media_file_name||"download")+'">📎 '+esc(m.media_file_name||"Download file")+'</a>';
   }
 }
 return '<div class="bubble '+(m.sender_id===me.id?"mine":"")+'" data-message-id="'+esc(m.id)+'">'+body+'<div class="message-actions"><button type="button" class="delete-message" data-message-id="'+esc(m.id)+'" title="Delete this message for me">Delete for me</button><span class="time">'+stamp(m.created_at)+'</span></div></div>';
}));
const existingThread=$("thread");
if(existingThread){
 const wasNearBottom=existingThread.scrollHeight-existingThread.scrollTop-existingThread.clientHeight<90;
 const oldNodes=new Map([...existingThread.querySelectorAll("[data-message-id].bubble")].map(node=>[node.dataset.messageId,node]));
 const keep=new Set();
 let position=0;
 for(const html of renderedRows){
   const holder=document.createElement("div");holder.innerHTML=html;
   const fresh=holder.firstElementChild;const id=fresh.dataset.messageId;
   const node=oldNodes.get(id)||fresh;
   keep.add(id);
   const current=existingThread.children[position]||null;
   if(current!==node)existingThread.insertBefore(node,current);
   position++;
 }
 for(const [id,node] of oldNodes){if(!keep.has(id))node.remove();}
 if(rows.length)existingThread.querySelector(".empty")?.remove();
 if(!rows.length&&!existingThread.querySelector(".empty"))existingThread.innerHTML='<div class="empty">No messages yet. Start the conversation.</div>';
 if(wasNearBottom)existingThread.scrollTop=existingThread.scrollHeight;
 if($("balanceText"))$("balanceText").innerHTML=balance.toLocaleString(undefined,{maximumFractionDigits:8})+' EMPC<small>Wallet balance</small>';
 return;
}
$("chat").innerHTML='<div class="chat-head"><button class="back" id="backBtn" aria-label="Back">‹</button><img class="avatar" src="'+esc(avatar(other.avatar_url))+'" alt=""><div><div class="chat-name">'+esc(other.display_name||other.username)+'</div><div class="chat-status">@'+esc(other.username)+'</div></div><div class="balance" id="balanceText">'+balance.toLocaleString()+' EMPC<small>Wallet balance</small></div></div><div class="thread" id="thread">'+(renderedRows.join("")||'<div class="empty">No messages yet. Start the conversation.</div>')+'</div><div class="composer"><div id="msgNotice" class="notice"></div><div class="fee-row"><span>Cost per message</span><strong>'+fee()+' EMPC '+(vip?"(VIP rate)":"")+'</strong></div><div class="compose-row"><textarea id="messageInput" maxlength="5000" placeholder="Write a private message..."></textarea><button class="send" id="sendBtn">Send</button></div>'+(vip?'<div class="media-tools"><input id="mediaInput" type="file" accept="image/*,video/*,audio/*" hidden><input id="fileInput" type="file" accept="*/*" hidden><button type="button" class="media-btn" id="mediaBtn">＋ Photo / Video</button><button type="button" class="media-btn" id="fileBtn">📎 File</button><button type="button" class="media-btn" id="voiceBtn">🎙 Record voice</button></div>':'<div class="vip-media-note">Photo, video, voice and file messages are available to VIP members.</div>')+'</div>';
$("backBtn").addEventListener("click",()=>{$("chat").classList.remove("mobile-open");$("side").classList.remove("mobile-hidden");selected=null;chatSession++;if(poller){clearInterval(poller);poller=null;}renderPeople();});
$("sendBtn").addEventListener("click",sendMessage);
$("thread").addEventListener("click",async e=>{
 const button=e.target.closest(".delete-message");if(!button)return;
 const id=button.dataset.messageId;if(!id||!confirm("Delete this message only from your view? The other participant will still see it."))return;
 button.disabled=true;
 try{const {error}=await db.rpc("hide_empire_message_for_me",{p_message_id:id});if(error)throw error;await renderChat(false);}
 catch(error){console.error(error);showNotice(error.message||"Message could not be deleted.");button.disabled=false;}
});
if(vip){
 $("mediaBtn")?.addEventListener("click",()=>$("mediaInput").click());
 $("fileBtn")?.addEventListener("click",()=>$("fileInput").click());
 $("fileInput")?.addEventListener("change",e=>{const file=e.target.files?.[0];if(file)sendMedia(file,"file");e.target.value="";});
 $("mediaInput")?.addEventListener("change",e=>{
   const file=e.target.files?.[0];if(file){
     const type=file.type.startsWith("image/")?"image":file.type.startsWith("video/")?"video":file.type.startsWith("audio/")?"audio":"file";
     sendMedia(file,type);
   }e.target.value="";
 });
 $("voiceBtn")?.addEventListener("click",toggleVoiceRecording);
}
const thread=$("thread");thread.scrollTop=thread.scrollHeight;
}
async function sendMessage(){const input=$("messageInput"),button=$("sendBtn");const content=input?.value.trim();if(!content)return;if(content.length>5000){showNotice("Message is too long (maximum 5000 characters).");return;}if(balance<fee()){showNotice("Insufficient EMPC balance. You need at least "+fee()+" EMPC.");return;}
button.disabled=true;button.textContent="Sending...";
try{const {data,error}=await db.rpc("send_empire_message",{p_receiver_id:selected.id,p_content:content});if(error)throw error;const result=Array.isArray(data)?data[0]:data;if(result?.remaining_balance!==undefined)balance=Number(result.remaining_balance);else await loadWallet();input.value="";await renderChat(true);}
catch(error){console.error(error);showNotice(error.message||"Message could not be sent.");}
finally{if($("sendBtn")){$("sendBtn").disabled=false;$("sendBtn").textContent="Send";}if($("balanceText"))$("balanceText").innerHTML=balance.toLocaleString(undefined,{maximumFractionDigits:8})+' EMPC<small>Wallet balance</small>';}
}

const [w,v,s]=await Promise.all([loadWallet(),loadVip(),loadEconomicSettings()]);
await loadConnectedMembers();renderPeople();
const target=new URLSearchParams(location.search).get("user_id");if(target&&target!==me.id){let targetMember=members.find(x=>x.id===target);if(!targetMember){const {data:external,error:externalError}=await db.from("public_user_profiles").select("id,username,display_name,avatar_url,membership_type").eq("id",target).maybeSingle();if(externalError)throw externalError;targetMember=external;}if(targetMember)await openChat(target,targetMember);}
}catch(e){console.error(e);$("people").innerHTML='<div class="empty">Could not load messages. Please sign in and refresh the page.</div>';}})();

/* Click any profile avatar to view it larger; tap outside or close to dismiss. */
(function installEmpireAvatarPreview(){
  if(document.getElementById("empireAvatarLightbox"))return;
  const box=document.createElement("div");box.id="empireAvatarLightbox";box.className="empire-avatar-lightbox";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-label","Profile photo preview");
  box.innerHTML='<button type="button" aria-label="Close photo preview">&times;</button><img alt="Profile photo enlarged">';
  document.body.appendChild(box);
  const preview=box.querySelector("img");
  function close(){box.classList.remove("is-open");preview.removeAttribute("src");}
  box.addEventListener("click",e=>{if(e.target===box||e.target.tagName==="BUTTON")close();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&box.classList.contains("is-open"))close();});
  document.addEventListener("click",e=>{
    const img=e.target.closest('img.avatar,img.avatar-large,img.avatar-small,img.community-author-avatar,img.post-author-avatar,.community-author img,.post-author img,.chat-head img.avatar');
    if(!img||!img.src||img.src.startsWith("data:"))return;
    e.preventDefault();e.stopPropagation();
    preview.src=img.currentSrc||img.src;box.classList.add("is-open");
  },true);
  document.querySelectorAll('img.avatar,img.avatar-large,img.avatar-small,.community-author img,.post-author img,.chat-head img.avatar').forEach(img=>img.classList.add("empire-avatar-zoom"));
})();
